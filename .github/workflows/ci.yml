name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs to save Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: hostryhq/.github/.github/workflows/go-ci.yml@main

  # internal/bustest brings up NATS JetStream and Postgres from infra/dev/compose.yaml (docker is
  # preinstalled on ubuntu runners) and loads event schemas from api-specs/events. The harness
  # looks for both as sibling directories of this checkout.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: go-common
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hostryhq/infra
          path: infra
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hostryhq/api-specs
          path: api-specs
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go-common/go.mod
          cache-dependency-path: go-common/go.sum
      - name: Integration tests (fail if they were skipped)
        working-directory: go-common
        run: |
          go test -tags integration -race -count=1 -v ./internal/bustest/... | tee "$RUNNER_TEMP/it.log"
          if grep -q -e '--- SKIP' "$RUNNER_TEMP/it.log"; then echo "integration tests were skipped" >&2; exit 1; fi

  secrets-scan:
    uses: hostryhq/.github/.github/workflows/gitleaks.yml@main

  # Single status check for the ruleset: "ci / required".
  required:
    if: always()
    needs: [go, integration, secrets-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
